apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Find every pod in the "tasktracker" namespace labelled app=tasktracker
      - job_name: tasktracker
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["tasktracker"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: tasktracker
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  alert-rules.yml: |
    groups:
      - name: tasktracker-alerts
        rules:
          - alert: TaskTrackerDown
            expr: up{job="tasktracker"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "TaskTracker pod {{ $labels.pod }} is down"
          - alert: HighErrorRate
            expr: sum(rate(app_http_requests_total{status=~"5.."}[1m])) / sum(rate(app_http_requests_total[1m])) > 0.2
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "More than 20% of requests are failing"
